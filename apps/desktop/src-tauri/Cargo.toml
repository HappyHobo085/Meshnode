[package]
name = "meshnode-desktop"
version = "0.1.0"
description = "Meshnode for desktop: the management app for a meshd daemon"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

# Its own workspace (the root workspace excludes apps/desktop): the Tauri and webview
# dependency tree stays out of the root builds.
[workspace]

[lib]
name = "meshnode_desktop"

[[bin]]
name = "meshnode-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mesh-admin = { path = "../../../crates/mesh-admin" }
mesh-ui = { path = "../../../crates/mesh-ui" }
mesh-ui-tauri = { path = "../../../crates/mesh-ui-tauri" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mesh-host = { path = "../../../crates/mesh-host", features = ["test-hooks"] }
tempfile = "3"

# Repeats the root workspace's patch (mesh-host's dependency tree is shared).
[patch.crates-io]
ndk-context = { path = "../../../patches/ndk-context" }
