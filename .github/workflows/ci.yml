name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # mesh-runtime's test fixtures are wasm32-wasip2 components.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The library crates must also build warning-free without their test hooks.
      - run: cargo clippy -p mesh-runtime -p mesh-services --lib -- -D warnings
      - run: cargo test --workspace --all-features

  # services/aegis-sync (its own workspace): the release build, the single-node harness and
  # the two-node mesh tests, and the vendored aegis-sync-core check. No Aegis checkout here,
  # so the check only validates the commit hash recorded in vendor/VENDORED.md.
  aegis-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            services/aegis-sync
      - run: cargo fmt --check --manifest-path services/aegis-sync/Cargo.toml
      - run: cargo clippy --locked --release --target wasm32-wasip2 --all-targets --manifest-path services/aegis-sync/Cargo.toml -- -D warnings
      - run: bash scripts/build-services.sh
      - run: cargo test -p mesh-services --test aegis_sync --test aegis_sync_mesh -j 2
      - run: bash scripts/sync-aegis-core.sh --check

  # Sub-spec 8a: the client SDK (mesh-client), the forwarding crate it shares with the
  # gateway (mesh-forward) and the Kotlin wrapper's Rust tests (mesh-client-ffi). The tests
  # start in-process hosts, which run the wasm32-wasip2 fixtures. What apps link must not
  # contain the WASM runtime or the host stack: `-e normal`, because the dev-dependencies
  # (the in-process hosts) do pull wasmtime in, and they are not linked by apps.
  mesh-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mesh-forward -p mesh-client -p mesh-client-ffi -j 2
      - name: No WASM runtime in what apps link
        run: |
          for p in mesh-client mesh-forward; do
            tree="$(cargo tree -p "$p" -e normal --prefix none)"
            if grep -E '^(wasmtime|mesh-runtime|mesh-services|mesh-gateway)( |$)' <<<"$tree"; then
              echo "::error::$p must not depend on the WASM runtime, services or gateway"
              exit 1
            fi
          done

  # Sub-spec 8a: the Kotlin bindings of mesh-client. The committed bindings must match the
  # exported interface; the Android libraries build for both ABIs and are packaged as the
  # AAR; the JVM test loads the host library built here through JNA.
  mesh-client-ffi-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The NDK the android-apk job and apps/android/build-apk.sh use.
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Kotlin bindings are up to date
        run: bash scripts/gen-client-bindings.sh --check
      # Release libmesh_client_ffi.so for arm64-v8a and x86_64, classes.jar, proguard.txt.
      - name: Build the AAR
        run: bash scripts/build-client-aar.sh
      - name: AAR contents
        run: |
          unzip -l dist/mesh-client.aar
          for f in AndroidManifest.xml classes.jar proguard.txt \
              jni/arm64-v8a/libmesh_client_ffi.so jni/x86_64/libmesh_client_ffi.so; do
            unzip -l dist/mesh-client.aar "$f" >/dev/null
          done
      - name: JVM test of the bindings
        run: bash crates/mesh-client-ffi/jvm-test/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-client-aar
          path: dist/mesh-client.aar

  proptest-long:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mesh-store --test props --release
        env:
          PROPTEST_CASES: "10000"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      # tauri::generate_context!() needs frontendDist (apps/ui/dist), which is not checked in.
      - name: Build the UI
        working-directory: apps/ui
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/android/src-tauri
      - run: rustup target add aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build -p mesh-store
      - run: cargo ndk -t arm64-v8a build -p mesh-services
      - run: cargo ndk -t arm64-v8a build -p mesh-gateway -p mesh-admin
      - run: cargo ndk -t arm64-v8a build -p mesh-host -p mesh-ffi
      # The Tauri project's crate is its own workspace; lint it for the Android target.
      - run: rustup component add clippy
      - run: cargo ndk -t arm64-v8a clippy --manifest-path apps/android/src-tauri/Cargo.toml --lib -- -D warnings

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  ts-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/gen-ts-types.sh --check

  desktop-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
            crates/mesh-ui-tauri
      - name: WebKitGTK and tray packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      # The Tauri build script embeds apps/ui/dist.
      - run: npm ci
        working-directory: apps/ui
      - run: npm run build
        working-directory: apps/ui
      # crates/mesh-ui-tauri and apps/desktop/src-tauri are outside the root workspace.
      - run: cargo fmt --manifest-path crates/mesh-ui-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/mesh-ui-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/mesh-ui-tauri/Cargo.toml
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # The "run without installing" test spawns a real `meshd run` (temp data dir, loopback
      # only); without MESHD_BIN it fails under CI rather than skipping.
      - run: cargo build -p meshd
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
        env:
          MESHD_BIN: ${{ github.workspace }}/target/debug/meshd${{ runner.os == 'Windows' && '.exe' || '' }}

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Versions recorded in apps/android/build-apk.sh; bump them together.
      TAURI_CLI_VERSION: "2.12.4"
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      # The APK embeds apps/ui/dist (frontendDist); build it first.
      - name: Build the UI
        working-directory: apps/ui
        run: |
          npm ci
          npm run build
      - run: sdkmanager "ndk;${NDK_VERSION}" "build-tools;36.0.0" "platforms;android-36" "platforms;android-35"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/android/src-tauri
      - run: rustup target add aarch64-linux-android
      - run: cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked
      - run: cargo install cargo-ndk --locked
      # The committed UniFFI Kotlin bindings must match mesh-ffi's interface.
      - name: Bindings are up to date
        env:
          UNIFFI_NO_FORMAT: "1"
        run: |
          apps/android/gen-bindings.sh
          git diff --exit-code -- apps/android/src-tauri/gen/android/app/src/main/java/net/meshnode/ffi/mesh_ffi.kt
      # Release (stripped, thin LTO) arm64 APK; unsigned (release signing is sub-spec 8).
      - name: Build the release APK
        run: apps/android/build-apk.sh --release
      # JNA and the UniFFI bindings are looked up by name: R8 must not rename them
      # (keep rules in app/proguard-rules.pro).
      - name: R8 keeps JNA and the bindings
        run: |
          m=apps/android/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt
          grep -q '^net\.meshnode\.ffi\.UniffiLib -> net\.meshnode\.ffi\.UniffiLib:' "$m"
          grep -q '^com\.sun\.jna\.Structure -> com\.sun\.jna\.Structure:' "$m"
      - name: JVM unit tests and lint
        working-directory: apps/android/src-tauri/gen/android
        run: ./gradlew testUniversalDebugUnitTest lintUniversalDebug
      - name: APK size
        run: ls -l apps/android/src-tauri/gen/android/app/build/outputs/apk/universal/release/
      - uses: actions/upload-artifact@v4
        with:
          name: meshnode-release-apk
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p meshd
      - run: cargo test -p mesh-admin
