[package]
name = "mesh-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mesh-hlc = { path = "../mesh-hlc" }
mesh-proto = { path = "../mesh-proto" }
mesh-store = { path = "../mesh-store" }
ed25519-dalek.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
postcard.workspace = true
iroh.workspace = true
iroh-blobs = { workspace = true, features = ["fs-store"] }
bytes.workspace = true
rand.workspace = true
blake3.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[features]
# Test-only helpers; the crate's own tests enable it through the dev-dependency below.
test-hooks = ["mesh-store/test-hooks"]

[dev-dependencies]
mesh-core = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
