# The Aegis sync server as a Meshnode WASM service: a `wasi:http` handler over `meshnode:kv`.
# Its own workspace (excluded from the main one), built for wasm32-wasip2 by
# `scripts/build-services.sh` and, for tests, by `mesh_runtime::test_fixtures::aegis_sync_wasm`.
[workspace]
resolver = "3"

[package]
name = "aegis-sync"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The vendored protocol core, WITHOUT its test-only `vectors` feature.
aegis-sync-core = { path = "../../vendor/aegis-sync-core" }
wstd = "0.6"
wit-bindgen = "0.57.1"
# The WASI wall clock and randomness (already a dependency of wstd).
wasip2 = "1"
futures-lite = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
debug = false
strip = true
