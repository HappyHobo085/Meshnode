[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["spikes", "crates/mesh-runtime/tests/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
ed25519-dalek = "3"
redb = "4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "io-util", "fs"] }
data-encoding = "2"
crc32fast = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
proptest = "1"
tempfile = "3"
blake3 = "1"
iroh = "1.4"
iroh-blobs = { version = "0.104", default-features = false }
rand = "0.9"
bytes = "1"
serde_json = "1"
hex = "0.4"
tokio-util = "0.7"
windows-sys = "0.61"
libc = "0.2"
wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"
wasmtime-wasi-http = "50.0.1"
http = "1"
http-body-util = "0.1"
async-trait = "0.1"
toml = "1"
tracing-appender = "0.2"
wat = "1"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
