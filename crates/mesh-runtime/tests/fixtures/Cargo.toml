# Guest components used by mesh-runtime's tests. A separate workspace (excluded from the
# main one), built for wasm32-wasip2 by `tests/common/mod.rs` into `<target>/fixtures`.
[workspace]
resolver = "3"
members = ["echo", "bad", "counter"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
wstd = "0.6"
wit-bindgen = "0.57.1"

[profile.release]
opt-level = "s"
debug = false
strip = true
