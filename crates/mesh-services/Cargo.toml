[package]
name = "mesh-services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mesh-core = { path = "../mesh-core" }
mesh-proto = { path = "../mesh-proto" }
mesh-runtime = { path = "../mesh-runtime" }
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Test-only helpers: injectable deployer timings, pausing the deployer, code cache stats.
test-hooks = ["mesh-core/test-hooks", "mesh-runtime/test-hooks"]

[dev-dependencies]
mesh-services = { path = ".", features = ["test-hooks"] }
mesh-core = { path = "../mesh-core", features = ["test-hooks"] }
mesh-runtime = { path = "../mesh-runtime", features = ["test-hooks"] }
mesh-hlc = { path = "../mesh-hlc" }
tempfile.workspace = true
hex.workspace = true
tracing-subscriber.workspace = true
wat.workspace = true
# The contract vectors and their loader (the test-only `vectors` feature); the service's own
# wasm build never enables it.
aegis-sync-core = { path = "../../vendor/aegis-sync-core", features = ["vectors"] }
# The 2.x line the vector keys are (`vector::device_key`), to sign tokens at other instants
# than the vectors' fixed clock. Already in the lock file through the core.
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "2" }
