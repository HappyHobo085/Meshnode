[package]
name = "mesh-ui-tauri"
version = "0.1.0"
description = "The Tauri command wrappers over mesh-ui, shared by the desktop and Android apps"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the root workspace (its `exclude` lists this crate): the root build stays
# free of Tauri and webview packages. The app workspaces depend on it by path; its own
# checks run with `--manifest-path crates/mesh-ui-tauri/Cargo.toml`.

[dependencies]
mesh-ui = { path = "../mesh-ui" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "macros"] }

[dev-dependencies]
async-trait = "0.1"
mesh-admin = { path = "../mesh-admin" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
